name: detections

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint YAML
        run: yamllint rules tests/fixtures
      - name: Validate rule metadata and conversion
        run: python scripts/validate.py
      - name: Unit-test rules against fixtures
        run: pytest -v
      - name: Convert to Splunk / Elastic and build coverage
        run: |
          python scripts/convert.py
          python scripts/coverage.py
      - uses: actions/upload-artifact@v6
        with:
          name: siem-queries-and-coverage
          path: build/
